name: Deploy to GitHub Pages

# Production publishes only from `main`, and only from a push to it or a deliberate
# manual run. There is no `pull_request_target` trigger anywhere in this repository:
# that trigger runs with repository write access in the context of untrusted fork code,
# which is the single most exploited GitHub Actions misconfiguration.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deliberately empty at the top level, so each job states exactly what it needs. The
# build job gets read-only access; only the deploy job may write to Pages.
permissions: {}

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read the source in order to build it; this job does not publish.

    steps:
      # Pinned to full commit SHAs. A tag can be repointed by whoever controls the
      # action's repository, and this workflow holds the credential that publishes the
      # production site.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # See the note in ci.yml: `npm ci` installs from the committed lockfile and verifies
      # integrity hashes, so no global npm install is needed.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      # Nothing with a known high or critical advisory reaches production.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      # The `github-pages` configuration sets base href to /depguard/, matching the
      # project-page URL https://dukeofwest.github.io/depguard/.
      - name: Build
        run: npm run build -- --configuration github-pages

      # The security properties of the artifact are verified before it is uploaded, not
      # after it is live. A failure here stops the deployment.
      - name: Content Security Policy proof
        run: npm run check:csp

      - name: Production artifact review
        run: npm run check:release

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/depguard/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # The only job in the repository with write access to anything, and it runs no
    # repository code: it publishes the artifact the build job produced and nothing else.
    permissions:
      pages: write # Publish the built artifact; the only write scope in this repository.
      id-token: write # OIDC token deploy-pages exchanges, so no long-lived secret exists.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
