name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the top level. No job here writes anything to the repository.
permissions:
  contents: read

# One run per ref. A second push supersedes the first instead of running alongside it,
# which stops a push-twice from occupying every runner and keeps the reported status
# attached to the newest commit. Flagged by Zizmor's concurrency-limits audit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable: whoever
      # controls the action's repository can repoint v4 at new code, which would execute
      # with this workflow's token. The comment records which release each SHA is, so the
      # pin stays auditable; Dependabot proposes the updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The checkout token is not needed after cloning, and leaving it in
          # .git/config would expose it to every later step, including anything a
          # dependency's build script does.
          persist-credentials: false

      # `cache: npm` is safe here as configured: the cache key is derived from
      # package-lock.json, GitHub scopes a pull-request cache so it cannot be written back
      # to the base branch's scope, and `npm ci` verifies every package against the
      # lockfile's integrity hashes after restoring. A poisoned cache entry therefore
      # fails the install rather than being installed.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # `npm ci` only, never `npm install`. It installs exactly what the lockfile pins and
      # verifies each package against its integrity hash.
      #
      # An earlier version of this workflow installed npm 11 globally first, because
      # npm 10.9.x's resolver fails on this tree with "Cannot read properties of null
      # (reading 'edgesOut')". That turned out to be unnecessary: the bug is in dependency
      # *resolution*, which only `npm install` performs. `npm ci` reads the committed
      # lockfile and was verified to work with the bundled npm 10.9.9. Removing the global
      # install also removed the one package in this pipeline that no lockfile covered.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails on any type error, including the strict options required by spec §4.2.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      # Fails if a documentation link breaks, or if the scoring weights, deductions,
      # request budget or host allowlist quoted in the docs stop matching the code.
      - name: Documentation check
        run: npm run check:docs

      - name: Production build
        run: npm run build -- --configuration github-pages

      # Proves the Content Security Policy is enforced by a real browser, with negative
      # controls. A policy that merely parses is not a policy that works.
      - name: Content Security Policy proof
        run: npm run check:csp

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      # Read the source to test it. This job publishes nothing and needs no write scope.
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # What actually ships to a visitor's browser. This must stay at zero: nothing here
      # is mitigated by "it only runs at build time".
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      # The build toolchain. Gated at high, because the dev tree carries a standing
      # population of moderate advisories in transitive build dependencies that are not
      # reachable from anything DepGuard ships or runs in CI. Each is triaged in
      # docs/SECURITY.md rather than silently ignored; a high or critical finding fails
      # the build and must be resolved or explicitly documented before release.
      - name: Audit build dependencies
        run: npm audit --audit-level=high

      # Registry signatures and provenance attestations. This checks that every package
      # installed is the one the registry signed, which is a different question from
      # whether it has a known advisory - and the one that would catch a tampered tarball
      # or a compromised publish.
      - name: Verify package signatures and provenance
        run: npm audit signatures

      # Report the full picture even when the gates pass, so moderates stay visible in
      # the log rather than accumulating unseen.
      - name: Full audit report
        if: always()
        run: npm audit || true

  workflows:
    name: Workflow security (Zizmor)
    runs-on: ubuntu-latest
    permissions:
      # Read the source to test it. This job publishes nothing and needs no write scope.
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Zizmor is a static analyser for GitHub Actions workflows: unpinned actions,
      # template injection into run blocks, excessive permissions, artifact and cache
      # poisoning, dangerous pull_request_target usage. Installed from PyPI at a pinned
      # version rather than run as a third-party action, which would itself be another
      # action to trust.
      - name: Install Zizmor
        run: pipx install zizmor==1.32.0

      - name: Analyse workflows
        run: zizmor --persona=auditor --min-severity=low .github/workflows/
