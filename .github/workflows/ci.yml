name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fails on any type error, including the strict options required by spec §4.2.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      # Fails if a documentation link breaks, or if the scoring weights, deductions,
      # request budget or host allowlist quoted in the docs stop matching the code.
      - name: Documentation check
        run: npm run check:docs

      - name: Production build
        run: npm run build -- --configuration github-pages
