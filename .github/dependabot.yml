# Dependency update automation.
#
# Two ecosystems matter here. npm is the application's own dependency tree, and
# github-actions is the set of third-party actions that run with access to this
# repository - which is why the actions are pinned to commit SHAs in the workflows.
# Dependabot understands a SHA pin with a version comment and will update both together,
# so pinning does not mean going stale.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Angular's packages move in lockstep, and each Angular major pins a narrow
      # TypeScript range as a peer dependency - Angular 22 requires ">=6.0 <6.1". So
      # typescript belongs in this group: separating them produced an Angular 22 pull
      # request that could not install at all, failing with an ERESOLVE peer conflict
      # instead of with something a reviewer could act on.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
          - 'typescript'
      lint-and-format:
        patterns:
          - 'typescript-eslint'
          - 'eslint*'
          - '@eslint/*'
          - 'angular-eslint'
          - 'prettier'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'jsdom'
    ignore:
      # TypeScript's major version is not ours to choose: each Angular major declares a
      # narrow peer range for it, and Angular 22 requires ">=6.0 <6.1". Dependabot picks
      # the `latest` dist-tag, so it proposed TypeScript 7 twice - once producing a pull
      # request that failed with ERESOLVE before installing anything, and once again
      # immediately after the Angular 22 upgrade landed.
      #
      # Minor and patch updates still come through. The major will arrive with the
      # Angular major that supports it, in the `angular` group above, which is the only
      # way the two can land together and install.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci'
